<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>座標複製</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            background: #111315;
            color: #e5e7eb;

            font-family:
                "Microsoft JhengHei",
                "Segoe UI",
                Arial,
                sans-serif;
        }

        .container {
            width: min(900px, 100%);
            margin: auto;
        }

        /* 標題 */

        h1 {
            margin: 0;
            font-size: 28px;
            color: #f3f4f6;
        }

        .description {
            margin-top: 8px;
            margin-bottom: 32px;

            color: #8b929b;
            font-size: 14px;
        }


        /* 區塊 */

        .section {
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #d1d5db;
        }


        /* 資料列表 */

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        /* 每筆資料 */

        .item {
            display: grid;

            grid-template-columns: 1fr auto;

            gap: 12px;

            padding: 12px;

            background: #181b1f;
            border: 1px solid #292d33;
            border-radius: 7px;

            transition: border-color 0.15s;
        }

        .item:hover {
            border-color: #3b4149;
        }


        /* 座標 */

        .coordinate {
            margin-bottom: 7px;

            color: #f3f4f6;

            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
        }


        /* 備註 */

        .note {
            width: 100%;

            padding: 6px 8px;

            background: #111315;
            color: #9ca3af;

            border: 1px solid #292d33;
            border-radius: 5px;

            outline: none;

            font-size: 13px;
        }

        .note:focus {
            border-color: #4b5563;
            color: #e5e7eb;
        }


        /* 按鈕區 */

        .actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        button {
            min-width: 64px;

            padding: 7px 11px;

            border: 1px solid #343941;
            border-radius: 5px;

            background: #22262b;
            color: #d1d5db;

            cursor: pointer;

            font-size: 13px;
        }

        button:hover {
            background: #2a2f35;
        }

        button.copied {
            background: #263b2d;
            border-color: #365a41;
            color: #9dd6aa;
        }

        .delete-btn:hover {
            background: #3a2525;
            border-color: #5b3636;
            color: #e9a3a3;
        }


        /* 新增區 */

        .add-area {
            display: flex;
            gap: 8px;

            margin-top: 10px;
        }

        .add-area input {
            flex: 1;

            min-width: 0;

            padding: 9px 10px;

            background: #181b1f;
            color: #e5e7eb;

            border: 1px solid #292d33;
            border-radius: 5px;

            outline: none;
        }

        .add-area input:focus {
            border-color: #4b5563;
        }

        .add-button {
            background: #252a30;
        }


        /* 手機版 */

        @media (max-width: 600px) {

            body {
                padding: 25px 12px;
            }

            .item {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: row;
            }

            .actions button {
                flex: 1;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <h1>座標複製</h1>

    <div class="description">
        點擊複製按鈕只會複製座標，備註不會被複製
    </div>


    <!-- ==================================================
         初始資料
         
         第一次開啟網頁時會使用這裡的資料。
         
         之後如果瀏覽器已經有儲存資料，
         則會優先使用 localStorage。
         ================================================== -->

    <script>

        const defaultPermanentData = [

            {
                coordinate: "37.808600,-122.409800",
                note: "舊金山"
            },

            {
                coordinate: "40.755200,-73.983000",
                note: "紐約"
            },

            {
                coordinate: "-23.551200,-46.658400",
                note: "巴西"
            },

            {
                coordinate: "25.048323,121.517228",
                note: "台灣"
            },

            {
                coordinate: "34.650110,135.510500",
                note: "大阪"
            },

            {
                coordinate: "35.669590,139.699690",
                note: "澀谷"
            },

            {
                coordinate: "-28.480537,-49.019741",
                note: "巴西鯊魚城道館區"
            },

            {
                coordinate: "-23.584990,-46.660970",
                note: "巴西伊比拉布埃拉公園"
            }

        ];


        const defaultTemporaryData = [

            {
                coordinate: "37.7833063, -122.4023469",
                note: ""
            },

            {
                coordinate: "37.7856427, -122.4011519",
                note: ""
            },

            {
                coordinate: "37.7887373, -122.3972886",
                note: ""
            },

            {
                coordinate: "37.7953273, -122.3937802",
                note: ""
            },

            {
                coordinate: "37.7908235, -122.4056349",
                note: ""
            },

            {
                coordinate: "37.7876774, -122.4079227",
                note: ""
            }

        ];

    </script>


    <!-- 常駐 -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">
                常駐
            </div>

        </div>

        <div
            class="list"
            id="permanentList">
        </div>

    </section>


    <!-- 臨時 -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">
                臨時
            </div>

        </div>

        <div
            class="list"
            id="temporaryList">
        </div>


        <!-- 新增臨時座標 -->

        <div class="add-area">

            <input
                id="newCoordinate"
                type="text"
                placeholder="輸入新的座標">

            <button
                class="add-button"
                onclick="addTemporary()">
                新增
            </button>

        </div>

    </section>

</div>


<script>

    /*
     * ==================================================
     * 資料管理
     * ==================================================
     */

    let permanentData =
        loadData(
            "permanentData",
            defaultPermanentData
        );

    let temporaryData =
        loadData(
            "temporaryData",
            defaultTemporaryData
        );


    /*
     * 從 localStorage 讀取資料
     */

    function loadData(key, defaultData) {

        const saved =
            localStorage.getItem(key);

        if (!saved) {
            return [...defaultData];
        }

        try {

            return JSON.parse(saved);

        } catch {

            return [...defaultData];

        }
    }


    /*
     * 儲存資料
     */

    function saveData() {

        localStorage.setItem(
            "permanentData",
            JSON.stringify(permanentData)
        );

        localStorage.setItem(
            "temporaryData",
            JSON.stringify(temporaryData)
        );
    }


    /*
     * ==================================================
     * 建立資料項目
     * ==================================================
     */

    function createItem(data, type, index) {

        const item =
            document.createElement("div");

        item.className = "item";


        /*
         * 左側內容
         */

        const content =
            document.createElement("div");


        const coordinate =
            document.createElement("div");

        coordinate.className = "coordinate";

        coordinate.textContent =
            data.coordinate;


        /*
         * 備註輸入框
         */

        const note =
            document.createElement("input");

        note.className = "note";

        note.type = "text";

        note.placeholder = "輸入備註";

        note.value = data.note || "";


        /*
         * 備註修改時自動保存
         */

        note.addEventListener(
            "input",
            () => {

                data.note = note.value;

                saveData();

            }
        );


        content.appendChild(coordinate);
        content.appendChild(note);


        /*
         * 右側按鈕
         */

        const actions =
            document.createElement("div");

        actions.className = "actions";


        /*
         * 複製按鈕
         */

        const copyButton =
            document.createElement("button");

        copyButton.textContent =
            "複製";

        copyButton.addEventListener(
            "click",
            () => {

                copyCoordinate(
                    data.coordinate,
                    copyButton
                );

            }
        );


        actions.appendChild(copyButton);


        /*
         * 臨時資料可以刪除
         */

        if (type === "temporary") {

            const deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "刪除";

            deleteButton.className =
                "delete-btn";

            deleteButton.addEventListener(
                "click",
                () => {

                    temporaryData.splice(
                        index,
                        1
                    );

                    saveData();

                    render();

                }
            );

            actions.appendChild(deleteButton);

        }


        item.appendChild(content);
        item.appendChild(actions);

        return item;
    }


    /*
     * ==================================================
     * 顯示資料
     * ==================================================
     */

    function render() {

        const permanentList =
            document.getElementById(
                "permanentList"
            );

        const temporaryList =
            document.getElementById(
                "temporaryList"
            );


        permanentList.innerHTML = "";
        temporaryList.innerHTML = "";


        permanentData.forEach(
            (data, index) => {

                permanentList.appendChild(
                    createItem(
                        data,
                        "permanent",
                        index
                    )
                );

            }
        );


        temporaryData.forEach(
            (data, index) => {

                temporaryList.appendChild(
                    createItem(
                        data,
                        "temporary",
                        index
                    )
                );

            }
        );

    }


    /*
     * ==================================================
     * 複製座標
     *
     * 只複製 coordinate
     * 不會複製 note
     * ==================================================
     */

    async function copyCoordinate(
        coordinate,
        button
    ) {

        try {

            await navigator.clipboard.writeText(
                coordinate
            );

            button.textContent =
                "已複製";

            button.classList.add(
                "copied"
            );


            setTimeout(
                () => {

                    button.textContent =
                        "複製";

                    button.classList.remove(
                        "copied"
                    );

                },
                1000
            );

        } catch (error) {

            console.error(error);

            alert(
                "無法複製座標，請確認瀏覽器允許剪貼簿操作。"
            );

        }

    }


    /*
     * ==================================================
     * 新增臨時座標
     * ==================================================
     */

    function addTemporary() {

        const input =
            document.getElementById(
                "newCoordinate"
            );

        const coordinate =
            input.value.trim();


        if (!coordinate) {
            return;
        }


        temporaryData.push({

            coordinate: coordinate,

            note: ""

        });


        saveData();

        render();


        input.value = "";

        input.focus();

    }


    /*
     * Enter 也可以新增
     */

    document
        .getElementById("newCoordinate")
        .addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    addTemporary();

                }

            }
        );


    /*
     * 初始顯示
     */

    render();

</script>

</body>

</html>
